name: Publier Veille Pharmaceutique

on:
  schedule:
    # Chaque lundi à 9h (UTC+2 = 7h UTC en été)
    - cron: '0 7 * * 1'

jobs:
  publish:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install requests
      
      - name: Run publish script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          VEILLE_FOLDER: ${{ github.workspace }}/veilles
        run: python publier_veille_github.py
